<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>{{TITLE}}</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
<style>
  /* Lead-CI: Werte kommen aus lead.json (ci). Platzhalter, bis CI verifiziert ist. */
  :root {
    --brand: #14213D;
    --accent: #E8743B;
    --bg: #FAF8F5;
    --surface: #FFFFFF;
    --text: #1B1B1B;
    --muted: #6E6E6E;
    --line: #E6E1DA;
    --dec: #A8B300;
    --g-purpur: #8E6BA8; --g-rot: #C8553D; --g-blau: #3D6FA8; --g-orange: #E0913A;
    --g-gruen: #6E9E4F; --g-gelb: #D9B53F; --g-tuerkis: #3FA8A0;
    --radius: 14px;
    --font: "Poppins", system-ui, sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #111318; --surface: #1A1D24; --text: #F2F2F2; --muted: #A9A9A9; --line: #2A2E37; --brand: #E9EDF5;
    }
  }
  :root[data-theme="dark"] { --bg: #111318; --surface: #1A1D24; --text: #F2F2F2; --muted: #A9A9A9; --line: #2A2E37; --brand: #E9EDF5; }

  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font-family: var(--font); font-weight: 300; line-height: 1.6; }
  .wrap { max-width: 1080px; margin: 0 auto; padding: 0 16px; }
  strong, h1, h2, h3 { font-weight: 600; }
  a { color: inherit; }

  header.hero { padding: 72px 16px 48px; }
  .kicker { font-size: .85rem; letter-spacing: .08em; text-transform: uppercase; color: var(--accent); font-weight: 600; }
  h1 { font-size: clamp(2rem, 5vw, 3.4rem); line-height: 1.1; margin: 12px 0 20px; color: var(--brand); max-width: 18ch; }
  .lead { font-size: 1.15rem; max-width: 62ch; color: var(--text); }

  .note { display: inline-flex; gap: 8px; align-items: center; margin: 20px 0 0; font-size: .82rem; color: var(--muted); border: 1px solid var(--line); border-radius: 10px; padding: 6px 14px; }
  .note::before { content: "i"; display: inline-grid; place-items: center; width: 16px; height: 16px; border-radius: 50%; border: 1px solid var(--muted); font-size: .7rem; font-weight: 600; }
  section { padding: 40px 0; }
  h2 { font-size: 1.6rem; margin: 0 0 8px; color: var(--brand); }
  .sub { color: var(--muted); margin: 0 0 28px; max-width: 64ch; }

  /* Muster */
  .pattern { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
  .pcard { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 22px; }
  .pcard h3 { margin: 0 0 4px; font-size: 1rem; }
  .pcard .src { font-size: .8rem; color: var(--muted); margin-bottom: 12px; }
  .chips { display: flex; flex-wrap: wrap; gap: 8px; }
  .chip { border: 1px solid var(--line); border-radius: 999px; padding: 4px 12px; font-size: .9rem; }
  .reading { margin-top: 16px; padding: 20px 22px; border-left: 4px solid var(--accent); background: var(--surface); border-radius: 0 var(--radius) var(--radius) 0; }
  .stair { display: flex; align-items: center; gap: 10px; margin-top: 18px; font-size: .85rem; color: var(--muted); flex-wrap: wrap; }
  .dot { width: 10px; height: 10px; border-radius: 50%; display: inline-block; }
  .stair .arrow { opacity: .5; }

  /* Handlungsfelder */
  .fields { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; }
  .fbtn { all: unset; cursor: pointer; background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 18px; display: flex; flex-direction: column; gap: 8px; transition: transform .15s, border-color .15s, box-shadow .15s; }
  .fbtn:hover { transform: translateY(-2px); box-shadow: 0 8px 24px rgba(0,0,0,.06); }
  .fbtn:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .fbtn[aria-selected="true"] { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent); }
  .fnum { font-size: .8rem; color: var(--accent); font-weight: 600; }
  .ftitle { font-weight: 600; line-height: 1.3; }

  .detail { margin-top: 16px; background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); overflow: hidden; }
  .dhead { padding: 24px 24px 0; }
  .dhead h3 { margin: 0; font-size: 1.35rem; color: var(--brand); }
  .flow { height: 3px; margin: 18px 24px 0; border-radius: 2px; }
  .cols { display: grid; grid-template-columns: 1fr 1fr; }
  .col { padding: 24px; }
  .col + .col { border-left: 1px solid var(--line); }
  .label { font-size: .78rem; letter-spacing: .08em; text-transform: uppercase; font-weight: 600; color: var(--muted); margin-bottom: 10px; }
  .col.future .label { color: var(--accent); }
  .step { margin-top: 18px; }
  .step .label { margin-bottom: 6px; }
  .evidence { font-size: .8rem; color: var(--muted); margin-top: 14px; }
  .nav { display: flex; justify-content: space-between; padding: 0 24px 22px; }
  .nav button { all: unset; cursor: pointer; font-size: .9rem; color: var(--muted); }
  .nav button:hover { color: var(--accent); }
  .detail-inner { animation: fade .25s ease; }
  @keyframes fade { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: none; } }

  /* CTA */
  .cta { background: var(--brand); color: var(--bg); border-radius: var(--radius); padding: 40px 32px; display: grid; grid-template-columns: 1.4fr 1fr; gap: 24px; align-items: center; }
  .cta h2 { color: inherit; }
  .cta p { margin: 0; opacity: .85; }
  .cta a.btn { justify-self: end; background: var(--accent); color: #fff; text-decoration: none; padding: 14px 24px; border-radius: 999px; font-weight: 600; }

  footer { padding: 40px 16px 56px; font-size: .82rem; color: var(--muted); }
  footer .row { display: flex; justify-content: space-between; gap: 24px; flex-wrap: wrap; align-items: flex-end; }
  footer ul { padding-left: 18px; margin: 8px 0 0; }
  .decmark { font-weight: 600; color: var(--text); }
  .decmark span { color: var(--dec); }

  @media (max-width: 820px) {
    .fields { grid-template-columns: 1fr 1fr; }
    .pattern, .cols, .cta { grid-template-columns: 1fr; }
    .col + .col { border-left: 0; border-top: 1px solid var(--line); }
    .cta a.btn { justify-self: start; }
  }
  @media (max-width: 420px) { .fields { grid-template-columns: 1fr; } }
</style>
</head>
<body>

<header class="hero wrap">
  <div class="kicker" id="kicker"></div>
  <h1 id="title"></h1>
  <p class="lead" id="intro"></p>
  <p class="note" id="note"></p>
</header>

<main class="wrap">
  <section id="muster">
    <h2 id="m-title"></h2>
    <p class="sub" id="m-sub"></p>
    <div class="pattern" id="m-cards"></div>
    <div class="reading" id="m-reading"></div>
    <div class="stair" id="m-stair" title="Kulturdynamik nach Clare W. Graves"></div>
  </section>

  <section id="felder">
    <h2>Vier Handlungsfelder</h2>
    <p class="sub">Klickt euch durch: Wo ihr heute steht - und was in sechs Monaten anders sein kann.</p>
    <div class="fields" role="tablist" id="f-list"></div>
    <div class="detail" id="f-detail" role="tabpanel" aria-live="polite"></div>
  </section>

  <section>
    <div class="cta">
      <div>
        <h2 id="c-title"></h2>
        <p id="c-text"></p>
      </div>
      <a class="btn" id="c-btn" href="#"></a>
    </div>
  </section>
</main>

<footer class="wrap">
  <div class="row">
    <div>
      <div id="disclaimer"></div>
      <div style="margin-top:12px"><strong>Quellen</strong><ul id="sources"></ul></div>
    </div>
    <div class="decmark">Dehn <span>Consulting</span></div>
  </div>
</footer>

<!-- ===== Lead-Daten: wird von scripts/build.py aus leads/<slug>/lead.json eingesetzt ===== -->
<script type="application/json" id="lead">
{{LEAD_JSON}}
</script>

<script>
(function () {
  const L = JSON.parse(document.getElementById('lead').textContent);
  const $ = (id) => document.getElementById(id);
  const esc = (s) => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
  const G = { PURPUR:'--g-purpur', ROT:'--g-rot', BLAU:'--g-blau', ORANGE:'--g-orange', GRUEN:'--g-gruen', GELB:'--g-gelb', TUERKIS:'--g-tuerkis' };
  const gv = (k) => `var(${G[k] || '--muted'})`;

  // CI
  const r = document.documentElement.style;
  if (L.ci) { r.setProperty('--brand', L.ci.brand); r.setProperty('--accent', L.ci.accent); }
  document.title = `${L.firma} - Was wird sein`;

  // Hero
  $('kicker').textContent = L.hero.kicker;
  $('title').textContent = L.hero.title;
  $('intro').textContent = L.hero.intro;
  $('note').textContent = L.hinweis;

  // Muster
  const M = L.muster;
  $('m-title').textContent = M.title;
  $('m-sub').textContent = M.sub;
  $('m-cards').innerHTML = M.karten.map(k => `
    <div class="pcard"><h3>${esc(k.titel)}</h3><div class="src">${esc(k.quelle)}</div>
    <div class="chips">${k.werte.map(w => `<span class="chip">${esc(w)}</span>`).join('')}</div></div>`).join('');
  $('m-reading').textContent = M.lesart;
  $('m-stair').innerHTML = M.treppe.map((t, i) =>
    `${i ? '<span class="arrow">→</span>' : ''}<span><span class="dot" style="background:${gv(t.farbe)}"></span> ${esc(t.label)}</span>`).join(' ');

  // Handlungsfelder
  const F = L.handlungsfelder;
  let cur = 0;
  $('f-list').innerHTML = F.map((f, i) => `
    <button class="fbtn" role="tab" id="tab-${f.id}" aria-controls="f-detail" data-i="${i}">
      <span class="fnum">${String(i + 1).padStart(2, '0')}</span><span class="ftitle">${esc(f.titel)}</span>
    </button>`).join('');

  function show(i) {
    cur = (i + F.length) % F.length;
    const f = F[cur];
    document.querySelectorAll('.fbtn').forEach((b, j) => b.setAttribute('aria-selected', j === cur));
    $('f-detail').innerHTML = `
      <div class="detail-inner">
        <div class="dhead"><h3>${esc(f.titel)}</h3></div>
        <div class="flow" style="background:linear-gradient(90deg, ${gv(f.graves.von)}, ${gv(f.graves.zu)})" title="Entwicklungsrichtung"></div>
        <div class="cols">
          <div class="col"><div class="label">Was ist heute</div><p>${esc(f.heute)}</p><div class="evidence">Beobachtet: ${esc(f.beleg)}</div></div>
          <div class="col future"><div class="label">Was wird sein</div>
            <div class="step"><div class="label">Erster Schritt</div><p>${esc(f.erster_schritt)}</p></div>
            <div class="step"><div class="label">Nach 6 Monaten</div><p>${esc(f.ergebnis_6m)}</p></div>
          </div>
        </div>
        <div class="nav"><button data-d="-1">← zurück</button><button data-d="1">weiter →</button></div>
      </div>`;
  }
  $('f-list').addEventListener('click', e => { const b = e.target.closest('.fbtn'); if (b) show(+b.dataset.i); });
  $('f-detail').addEventListener('click', e => { const b = e.target.closest('[data-d]'); if (b) show(cur + +b.dataset.d); });
  document.addEventListener('keydown', e => {
    if (!document.activeElement.closest('#felder')) return;
    if (e.key === 'ArrowRight') show(cur + 1);
    if (e.key === 'ArrowLeft') show(cur - 1);
  });
  show(0);

  // CTA + Footer
  const C = L.cta;
  $('c-title').textContent = C.title;
  $('c-text').textContent = C.text;
  $('c-btn').textContent = C.button;
  $('c-btn').href = `mailto:${C.mailto}?subject=${encodeURIComponent(C.betreff)}`;
  $('disclaimer').textContent = L.disclaimer;
  $('sources').innerHTML = L.quellen.map(q => `<li><a href="${esc(q.url)}" target="_blank" rel="noopener">${esc(q.titel)}</a></li>`).join('');
})();
</script>
</body>
</html>
